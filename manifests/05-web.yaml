apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: three-tier
data:
  index.html: <!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport"
    content="width=device-width,initial-scale=1"><title>Three-tier lab</title><body><h1>NGINX
    → Spring Boot → MariaDB / Redis</h1><p>버튼을 눌러 API를 조회하세요. 최초 응답은 MariaDB, 60초
    이내 재조회는 Redis를 사용합니다.</p><button id="load">API 조회</button><pre id="result"></pre><script>document.getElementById('load').onclick=async()=>{try
    {const r=await fetch('/api/hello');if(!r.ok)throw new Error('HTTP '+r.status);document.getElementById('result').textContent=JSON.stringify(await
    r.json(),null,2);}catch(e){document.getElementById('result').textContent=e.message;}};</script></body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: three-tier
spec:
  selector:
    app: web
  ports:
  - name: tcp
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: three-tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: docker.io/library/nginx:stable-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
      volumes:
      - name: html
        configMap:
          name: web-content
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
